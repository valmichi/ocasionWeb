<div class="container">
    <h2> Salones Disponibles para Renta 🎉</h2>
    
    <div *ngIf="isLoading" class="cargando">Cargando salones...</div>
    
    <div *ngIf="salones.length === 0 && !isLoading" class="alerta">
        No hay salones disponibles en este momento.
    </div>
    
    <div class="lista-salones">
    <div *ngFor="let salon of salones" class="tarjeta-salon">
        <h3>{{ salon.nombre }}</h3>
        <p>{{ salon.descripcion }}</p>
        <p>{{ salon.ubicacion?.ciudad }}, {{ salon.ubicacion?.estado }}</p>
        <p> <strong>Precio:</strong> \${{ salon.precioHora }} / hora</p>
        <p> <strong>Capacidad:</strong> {{ salon.capacidad }}</p>
        
        <button class="btn-principal" (click)="verDetalle(salon.id)">
            Ver Fechas y Reservar
        </button>
    </div>
    </div>
</div>
